---
- hosts: localhost
  become: yes
  connection: local

  vars:
    prometheus_config: "/etc/prometheus/prometheus.yml"

  tasks:
    - name: Check variables
      ansible.builtin.fail:
        msg: "The {{ item }} was not passed or empty"
      when: item is not defined or item == ""
      with_items:
        - customer
        - domain

    - name: Configure Prometheus
      ansible.builtin.blockinfile:
        path: "{{ prometheus_config }}"
        # append_newline: yes <--- since ansible-core v2.16
        backup: yes
        insertafter: EOF
        marker: "# ORCHESTRATOR MANAGED"
        block: |2
            - job_name: "{{ customer }}.{{ domain }}"
              honor_labels: true
              static_configs:
                - targets: ["{{ customer }}.{{ domain }}:9110"]

    - name: Restart Prometheus
      ansible.builtin.systemd_service:
        state: restarted
        name: prometheus
