- hosts: "{{ target }}"
  roles:
    - { role: system, tags: system }
    - { role: redis, tags: redis }
    - { role: mosquitto, tags: mosquitto }
    - { role: postgres, tags: postgres }
    - { role: chirpstack, tags: chirpstack }
    - { role: timescaledb, tags: timescaledb }
    - { role: grafana, tags: grafana }
    - { role: prometheus_node_exporter, tags: prometheus_node_exporter }
    - { role: mqtt_postgres_inserter, tags: mqtt_postgres_inserter }
    - { role: cleanup, tags: cleanup }
