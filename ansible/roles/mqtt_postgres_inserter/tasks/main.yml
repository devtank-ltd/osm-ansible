---
# tasks file for roles/mqtt_postgres_inserter

- name: "Install MQTT Postgres inserter"
  include_tasks: "install.yml"

- name: "Setup MQTT Postgres inserter"
  include_tasks: "setup.yml"

- name: "Enable and start MQTT Postgres inserter service"
  systemd:
    name: mqtt-postgres-inserter.service
    state: restarted
    enabled: yes
