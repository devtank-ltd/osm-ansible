- name: Create debs directory if it does not exist
  ansible.builtin.file:
    path: /tmp/debs
    state: directory
    mode: '0755'

- name: Download Devtank debian packages
  get_url:
    url: "{{ item.url }}"
    dest: "{{ item.dest }}"
  loop:
    - { url: "https://cloud.devtank.co.uk/debs/python3-rx_4.0.4-3_all.deb",               dest: "/tmp/debs/python3-rx_4.0.4-3_all.deb" }
    - { url: "https://cloud.devtank.co.uk/debs/python3-influxdb-client_1.40.0-3_all.deb", dest: "/tmp/debs/python3-influxdb-client_1.40.0-3_all.deb" }
    - { url: "https://cloud.devtank.co.uk/debs/mqtt-influx-inserter_1.0.0-1_all.deb",     dest: "/tmp/debs/mqtt-influx-inserter_1.0.0-1_all.deb" }

- name: Install Devtank debian packages
  apt:
    deb: "{{ item }}"
  loop:
    - /tmp/debs/python3-rx_4.0.4-3_all.deb
    - /tmp/debs/python3-influxdb-client_1.40.0-3_all.deb
    - /tmp/debs/mqtt-influx-inserter_1.0.0-1_all.deb
