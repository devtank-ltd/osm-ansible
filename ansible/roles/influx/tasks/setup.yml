---

- name: Detect existing config
  command: "influx config list --hide-headers"
  register: influx_config_list

- name: Initial influx setup
  block:

    - name: Generate passwords
      set_fact:
        influx_passwords: "{{ influx_passwords | default({}) | combine({ item: lookup('ansible.builtin.password', '/dev/null', length=16) }) }}"
      loop:
        - devtank
        - customer
        - grafana
        - chirpstack

    - name: Setup influx
      command: >
        influx setup
        --force
        --username devtank
        --password={{ influx_passwords['devtank'] }}
        --org devtank
        --bucket dtbucket
      ignore_errors: True

  when: influx_config_list.stdout_lines | length == 0 or overwrite_passwords


- name: Generate authentication token
  block:

    - name: "Get current token"
      command: 'influx auth list --json'
      register: influx_auths

    - name: "Save current token"
      set_fact:
        influx_token: "{{ influx_auths.stdout | from_json | first | json_query('token') }}"
        influx_token_id: "{{ influx_auths.stdout | from_json | first | json_query('id') }}"

- name: Create InfluxDB buckets, retention policies, and auth
  vars:
    influx_buckets:
      - sf
      - cc_kwh_transform
  block:
    - name: Create buckets
      shell: "influx bucket create -n {{ item }}"
      loop: "{{ influx_buckets }}"
      ignore_errors: True

    - name: Create v1 retention policies
      shell: >
        influx v1 dbrp create --default --db {{ item }} --rp autogen
        --bucket-id "$(influx bucket list | awk '/{{ item }}/ { print $1 }')"
      loop: "{{ influx_buckets }}"
      ignore_errors: True

    - name: Create v1 auth for devtank on each bucket
      shell: >
        influx v1 auth create
        --read-bucket "$(influx bucket list | awk '/{{ item }}/ { print $1 }')"
        --write-bucket "$(influx bucket list | awk '/{{ item }}/ { print $1 }')"
        --username devtank
        --password '{{ influx_passwords["devtank"] }}'
      loop: "{{ influx_buckets }}"
      ignore_errors: True

- name: Create tasks for downsampling kWh data
  ansible.builtin.uri:
    url: http://localhost:8086/api/v2/tasks
    method: POST
    headers:
      Authorization: "Token {{ influx_token }}"
      Content-Type: "application/json"
    body: >-
      {
        "flux": "option task = {name: \"downsample_{{ item.aggr }}_precision\", every: {{ item.every }}, offset: 0m}
        cc = from(bucket: \"sf\")
          |> range(start: {{ item.start }}, stop: {{ item.stop }})
          |> filter(fn: (r) => r[\"_measurement\"] == \"mqtt_consumer\")
          |> filter(fn: (r) => r[\"_field\"] =~ /CC[1-3]/)
          |> map(fn: (r) => ({r with _value: float(v: r._value) / (1000. * 1000.) * 240.}))
        cc
          |> aggregateWindow(every: {{ item.aggr }}, fn: mean)
          |> to(bucket: \"cc_kwh_transform\")",
        "orgID": "1",
        "status": "active",
        "description": "This task downsamples kWh data every {{ item.aggr }}"
      }
    body_format: json
    status_code: 201
  loop:
    - { every: "1y", start: "-1y", stop: "-39w", aggr: "1h" }
    - { every: "1y", start: "-39w", stop: "-26w", aggr: "45m" }
    - { every: "1y", start: "-26w", stop: "-13w", aggr: "30m" }
    - { every: "1y", start: "-13w", stop: "-7d", aggr: "5m" }
