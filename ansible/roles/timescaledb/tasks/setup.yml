- name: Timescaledb operations
  block:
    - name: Create timescaledb users
      community.postgresql.postgresql_user:
        name: "{{ item.key }}"
        password: "{{ item.value }}"
      loop: "{{ timescaledb_passwords | dict2items }}"

    - name: Create database
      postgresql_db:
        name: "{{ timescaledb_db }}"
        owner: "{{ timescaledb_owner }}"

    - name: Add timescaledb extension
      postgresql_ext:
        name: "timescaledb"
        db: "{{ timescaledb_db }}"

    - name: GRANT ALL PRIVILEGES ON DATABASE
      community.postgresql.postgresql_privs:
        login_db: postgres
        privs: ALL
        type: database
        obj: "{{ timescaledb_db }}"
        role: "{{ timescaledb_owner }}"

    - name: GRANT ALL PRIVILEGES ON SCHEMA public TO {{ timescaledb_owner }}
      postgresql_privs:
        login_db: "{{ timescaledb_db }}"
        privs: ALL
        type: schema
        objs: public
        role: "{{ timescaledb_owner }}"

  become: yes
  become_user: postgres

- name: Create tariff table
  postgresql_table:
    login_db: "{{ timescaledb_db }}"
    login_user: "{{ timescaledb_owner }}"
    login_password: "{{ timescaledb_passwords['devtank'] }}"
    login_host: 127.0.0.1
    name: tariffs
    columns:
    - id BIGSERIAL PRIMARY KEY
    - rate FLOAT
    - weekday INT
    - valid_from TIMESTAMP NOT NULL
    - valid_to TIMESTAMP
    - tag TEXT
    - start_hour INT
    - end_hour INT

- name: Create osm table
  postgresql_table:
    login_db: "{{ timescaledb_db }}"
    login_user: "{{ timescaledb_owner }}"
    login_password: "{{ timescaledb_passwords['devtank'] }}"
    login_host: 127.0.0.1
    name: osms
    columns:
    - id BIGSERIAL PRIMARY KEY
    - name TEXT NOT NULL
    - topic TEXT NOT NULL UNIQUE

- name: Create pg_sf table
  postgresql_table:
    login_db: "{{ timescaledb_db }}"
    login_user: "{{ timescaledb_owner }}"
    login_password: "{{ timescaledb_passwords['devtank'] }}"
    login_host: 127.0.0.1
    name: pg_sf
    columns:
    - id BIGSERIAL
    - measurement TEXT
    - _value FLOAT
    - _value_text TEXT
    - _time TIMESTAMPTZ not null
    - osm_id INT
    - CONSTRAINT fk_osm_id FOREIGN KEY (osm_id) REFERENCES osms(id)

- name: Create TimescaleDB hypertable using postgresql_query
  community.postgresql.postgresql_query:
    db: "{{ timescaledb_db }}"
    query: "SELECT create_hypertable('pg_sf', by_range('_time'));"
    login_user: "{{ timescaledb_owner }}"
    login_password: "{{ timescaledb_passwords['devtank'] }}"
    login_host: 127.0.0.1

- name: Grant privs to customer on database library
  community.postgresql.postgresql_privs:
    login_db: "{{ timescaledb_db }}"
    state: present
    privs: SELECT
    type: table
    objs: pg_sf,tariffs,osms
    schema: public
    roles: customer
    grant_option: true
  become: yes
  become_user: postgres
