- hosts: "{{ target }}"
  vars:
    install_only: True
  roles:
    - { role: redis, tags: redis }
    - { role: mosquitto, tags: mosquitto }
    - { role: postgres, tags: postgres }
    - { role: chirpstack, tags: chirpstack }
    - { role: grafana, tags: grafana }
  tasks:
    - name: Extra packages
      apt:
        name:
          - python3-paho-mqtt
          - python3-urllib3
          - wireguard
          - python3-prometheus-client
          - vim
