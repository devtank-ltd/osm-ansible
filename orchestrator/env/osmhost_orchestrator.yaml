- hosts: "{{ target }}"
  vars:
    wg_ipaddr: "{{ wg_ipaddr }}"
    wg_port: "{{ wg_port }}"
    orchestrator_private_key: "{{ orchestrator_private_key }}"
    devtank_debs_url: "https://cloud.devtank.co.uk/debs"

  tasks:

    - name: "Setting host's network interface fact"
      set_fact:
        wg_interface: "{{ ansible_default_ipv4.interface }}"

    - name: Install required packages
      apt:
        name:
          - ansible
          - apt-transport-https
          - curl
          - default-mysql-client
          - default-mysql-server
          - git
          - golang-go
          - iproute2
          - iptables
          - pdns-backend-mysql
          - pebble
          - prometheus
          - prometheus-pushgateway
          - python3
          - python3-crcmod
          - python3-fastapi
          - python3-paho-mqtt
          - python3-paramiko
          - python3-pip
          - python3-pymysql
          - python3-sqlalchemy
          - python3-venv
          - python3-yaml
          - software-properties-common
          - vim
          - wget
          - wireguard
        update_cache: yes

    - name: Install pyosmorch package
      block:
        - name: Set pyosmorch variables
          ansible.builtin.set_fact:
            pkg_name: python3-pyosmorch
            pkg_ver: "0.0.1-1"
            devtank_debs: "https://cloud.devtank.co.uk/debs"

        - name: Download pyosmorch package
          ansible.builtin.get_url:
            url: "{{ devtank_debs }}/{{ pkg_name }}_{{ pkg_ver }}_all.deb"
            dest: "/tmp"

        - name: Install pyosmorch
          ansible.builtin.apt:
            deb: "/tmp/{{ pkg_name }}_{{ pkg_ver }}_all.deb"

    - name: Install osm_alert_mqtt
      block:
        - name: Set osm_alert_mqtt variables
          ansible.builtin.set_fact:
            pkg_name: osm_alert_mqtt
            pkg_ver: "0.0.1-1"
            devtank_debs: "https://cloud.devtank.co.uk/debs"

        - name: Download osm_alert_mqtt package
          ansible.builtin.get_url:
            url: "{{ devtank_debs }}/{{ pkg_name }}_{{ pkg_ver }}_all.deb"
            dest: "/tmp"

        - name: Install osm_alert_mqtt
          ansible.builtin.apt:
            deb: "/tmp/{{ pkg_name }}_{{ pkg_ver }}_all.deb"

    - name: Clone OSM Ansible git repo.
      ansible.builtin.git:
        repo: https://git.devtank.co.uk/Devtank/osm-ansible.git
        dest: /srv/osm-lxc
        single_branch: yes
        version: "{{ osm_ansible_branch }}"

    - name: "Prepare MiniCA"
      block:
        - name: "Fetch MiniCA sources from github"
          git:
            repo: https://github.com/jsha/minica.git
            dest: /srv/osm-lxc/utils/minica
            single_branch: yes
            version: master

        - name: "Build MiniCA"
          shell: go build
          args:
            chdir: /srv/osm-lxc/utils/minica

    # TODO: move names to variables
    - name: "Generate key and cert"
      shell: |
        ./minica -ca-cert devtank.minica.pem -ca-key devtank.minica.key.pem --domains localhost,{{ osm_domain }}
      args:
        chdir: /srv/osm-lxc/utils/minica

    - name: "Prepare pebble configuration"
      block:
        - name: "Create pebble configuration directory"
          file:
            path: /srv/osm-lxc/configs/pebble/
            state: directory

        - name: "Create pebble configuration file"
          copy:
            dest: "/srv/osm-lxc/configs/pebble/pebble-config.json"
            content: |
              {
                "pebble": {
                  "listenAddress": "0.0.0.0:14000",
                  "managementListenAddress": "0.0.0.0:15000",
                  "certificate": "/srv/osm-lxc/configs/pebble/localhost/cert.pem",
                  "privateKey": "/srv/osm-lxc/configs/pebble/localhost/key.pem",
                  "httpPort": 5002,
                  "tlsPort": 5001,
                  "ocspResponderURL": "",
                  "externalAccountBindingRequired": false
                }
              }

    # TODO: bash for names expansion?
    - name: "Copy certificates to pebble configuration directory"
      shell: |
        cp devtank.minica.pem /srv/osm-lxc/configs/pebble/
        cp devtank.minica.key.pem /srv/osm-lxc/configs/pebble/
        cp -r localhost /srv/osm-lxc/configs/pebble/
      args:
        chdir: /srv/osm-lxc/utils/minica

    - name: "Install pebble systemd service"
      copy:
        src: /srv/osm-lxc/orchestrator/env/dist/systemd/pebble.service
        dest: /etc/systemd/system/
        remote_src: yes

    - name: "Install pebble systemd service"
      copy:
        src: /srv/osm-lxc/orchestrator/env/dist/systemd/pebble-challtestsrv.service
        dest: /etc/systemd/system/
        remote_src: yes

    - name: Stop PDNS
      service:
        name: pdns.service
        state: stopped

    - name: "Start pebble-challtestsrv"
      systemd_service:
        name: pebble-challtestsrv
        state: started
        daemon_reload: true
        enabled: true
      tags: pebble

    - name: "Start pebble ACME"
      systemd_service:
        name: pebble
        state: restarted
        enabled: true
      tags: pebble

    - name: "Create PDNS DB Password"
      ansible.builtin.set_fact:
        pdns_db_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=16, chars=['ascii_letters', 'digits']) }}"

    - name: Setup PDNS MySQL
      shell: |
        echo "CREATE DATABASE pdns;\
        GRANT ALL ON pdns.* to pdns@localhost IDENTIFIED BY '{{ pdns_db_password }}';\
        FLUSH PRIVILEGES;" | mysql -uroot
        cat /usr/share/doc/pdns-backend-mysql/schema.mysql.sql | mysql -uroot pdns

    - name: "Add MySQL setup to PDNS"
      shell:
        printf "#### MYSQL CONFIG\n
        launch=gmysql\n
        gmysql-host=127.0.0.1\n
        gmysql-port=3306\n
        gmysql-dbname=pdns\n
        gmysql-user=pdns\n
        gmysql-password={{ pdns_db_password }}\n
        gmysql-dnssec=no" > /etc/powerdns/pdns.d/mysql.conf

    - name: Remove PDNS bind file
      file:
        state: absent
        path: "/etc/powerdns/pdns.d/bind.conf"

    - name: "Populate PDNS MySQL"
      shell: |
        echo "INSERT INTO domains (id,name,type) values (1,'{{ osm_domain }}','MASTER');
        INSERT INTO records (domain_id,name,type,prio,content,ttl) VALUES (1,'{{ osm_domain }}','SOA',0,'{{ osm_host_name }}.{{ osm_domain }} hostmaster.{{ osm_domain }} 20230717 10800 10800 108000 1800',1800);
        INSERT INTO records (domain_id,name,type,prio,content,ttl) VALUES (1,'{{ osm_domain }}','NS',0,'{{ osm_host_name }}.{{ osm_domain }}',10800);
        INSERT INTO records (domain_id,name,type,prio,content,ttl) VALUES (1,'{{ osm_host_name }}.{{ osm_domain }}','A',0,'{{ osm_dns }}',10800);
        " | mysql -uroot pdns

    - name: "Create OSM Orchestrator DB Password"
      ansible.builtin.set_fact:
        osm_orchestrator_db_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=16, chars=['ascii_letters', 'digits']) }}"
        osm_alert_db_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=16) }}"

    - name: Create readonly DB user
      community.mysql.mysql_user:
        login_unix_socket: /var/run/mysqld/mysqld.sock
        name: alert
        password: "{{ osm_alert_db_password }}"
        state: present
        priv: 'osm_orchestrator.*:SELECT'

    - name: "Create OSM Orchestrator DB"
      shell: |
        cat /srv/osm-lxc/orchestrator/schema.sql | sed 's|change_this_password|{{ osm_orchestrator_db_password }}|g' |  mysql -uroot

    - name: "Write out OSM Orchestrator Config"
      vars:
        object:
            orchestrator:
                user: 'osm_orchestrator'
                password: '{{ osm_orchestrator_db_password }}'
                host: 'localhost'
                database: 'osm_orchestrator'
            pdns:
                user: 'osm_orchestrator'
                password: '{{ osm_orchestrator_db_password }}'
                host: 'localhost'
                database: 'pdns'
            customer_alerts:
                user: "alert"
                password: '{{ osm_alert_db_password }}'
            pdns_domain: '{{ osm_domain }}'
            pdns_domain_id: 1
            plugin_dir: /srv/osm-lxc/orchestrator/plugins
      copy:
        content: "{{ object | to_nice_yaml(indent=2) }}"
        dest: /srv/osm-lxc/orchestrator/config.yaml

    - name: Generate master encryption data
      shell: |
        /usr/bin/python3 crypt.py
      args:
        chdir: /srv/osm-lxc/orchestrator
        creates: master.json

    - name: Restart PDNS
      service:
        name: pdns.service
        state: started

    - name: "Enable IP forwarding"
      sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        sysctl_set: true
        state: present
        reload: true

    - name: "Populate OSM WireGuard table with initial data"
      shell: |
        echo "INSERT INTO osm_wireguard (id, osm_hosts_id, public_key, private_key, ip_addr) VALUES (1, NULL, '{{ orchestrator_public_key }}', '{{ orchestrator_private_key }}', '{{ wg_ipaddr }}');" | mysql -uroot osm_orchestrator

    - name: "Apply WireGuard configuration"
      template:
        src: "templates/orchestrator_wireguard.j2"
        dest: "/etc/wireguard/wg0.conf"

    - name: "Restart WireGuard"
      systemd_service:
        name: wg-quick@wg0.service
        state: restarted
        enabled: true

    - name: "Install orchestrator fastAPI systemd service"
      copy:
        src: /srv/osm-lxc/orchestrator/env/dist/systemd/devtank-fastapi.service
        dest: /etc/systemd/system/
        remote_src: yes

    - name: "Start orchestrator fastAPI service"
      systemd_service:
        name: devtank-fastapi
        state: started
        daemon_reload: true
        enabled: true

    - name: Bootstrap qery-exporter
      block:
        - name: Download query-exporter sources
          ansible.builtin.git:
            repo: 'https://github.com/albertodonato/query-exporter.git'
            dest: '/srv/osm-lxc/utils/query_exporter'
            version: 3.2.0

        - name: Activate venv for query-exporter
          ansible.builtin.pip:
            name: query-exporter
            virtualenv: "/srv/osm-lxc/utils/query_exporter"
            virtualenv_command: "/usr/bin/python3 -m venv"

        - name: Install PyMySQL
          ansible.builtin.pip:
            name: PyMySQL
            state: present
            virtualenv: "/srv/osm-lxc/utils/query_exporter"
            virtualenv_command: "/usr/bin/python3 -m venv"

        - name: Generate query-exporter config
          ansible.builtin.copy:
            dest: /srv/osm-lxc/utils/query_exporter/config.yaml
            content: |
              databases:
                osm_orchestrator:
                  dsn: mysql+pymysql://osm_orchestrator:{{ osm_orchestrator_db_password }}@localhost/osm_orchestrator
                  keep-connected: true
              metrics:
                customer_active_status:
                  type: gauge
                  description: Active status of devtank customers
                  labels: [customer]

              queries:
                query:
                  interval: 10
                  databases: [osm_orchestrator]
                  metrics: [customer_active_status]
                  sql: |
                    SELECT name AS customer,
                    CASE
                        WHEN active_before IS NULL THEN 1
                            ELSE 0
                    END AS customer_active_status
                    FROM osm_customers;

        - name: Generate query-exporter systemd service
          ansible.builtin.copy:
            dest: /etc/systemd/system/query-exporter.service
            content: |
              [Unit]
              Description=query-exportes to report customers state
              After=network.taget

              [Service]
              WorkingDirectory=/srv/osm-lxc/utils/query_exporter
              ExecStart=/srv/osm-lxc/utils/query_exporter/bin/query-exporter
              Restart=always
              RestartSec=5

              [Install]
              WantedBy=multi-user.target
            owner: root
            group: root
            mode: 0644

        - name: Start and enable query-exporter service
          ansible.builtin.systemd_service:
            name: query-exporter
            state: started
            enabled: true
            daemon_reload: true

    - name: "Apply prometheus configuration file"
      template:
        src: "templates/prometheus/prometheus.yml.j2"
        dest: "/etc/prometheus/prometheus.yml"

    - name: "Apply prometheus alert rules"
      copy:
        src: "templates/prometheus/prometheus.rules"
        dest: "/etc/prometheus/prometheus.rules"

    - name: "Restart prometheus"
      ansible.builtin.service:
        name: prometheus
        state: restarted

    - name: "Download Grafana GPG key"
      shell: "wget -q -O - https://apt.grafana.com/gpg.key | gpg --dearmor | sudo tee /etc/apt/keyrings/grafana.gpg > /dev/null"

    - name: "Make sure Grafana apt source exists"
      lineinfile:
        path: "/etc/apt/sources.list.d/grafana.list"
        line: "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://packages.grafana.com/oss/deb stable main"
        create: yes

    - name: "Install Grafana"
      apt:
        name: "grafana-nightly"
        update_cache: yes

    - name: "Apply grafana configuration file"
      template:
        src: "templates/grafana/grafana.ini.j2"
        dest: "/etc/grafana/grafana.ini"

    - name: "Create Orch Grafana Admin Password"
      ansible.builtin.set_fact:
        orch_grafana_admin_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=16, chars=['ascii_letters', 'digits']) }}"

    - name: "Set Grafana Admin Password"
      command: "grafana-cli admin reset-admin-password {{ orch_grafana_admin_password }}; chown grafana: /var/lib/grafana/grafana.db;"

    - name: "Start and enable Grafana"
      systemd:
        name: "grafana-server"
        state: restarted
        enabled: yes
        daemon_reload: yes

    - name: "Wait for Grafana API"
      ansible.builtin.uri:
        url: http://localhost:3000/api/health
        method: GET
      retries: 3

    - name: "Create Grafana Service Account"
      ansible.builtin.uri:
        url: http://localhost:3000/api/serviceaccounts
        url_username: admin
        url_password: "{{ orch_grafana_admin_password }}"
        force_basic_auth: true
        method: POST
        body_format: json
        headers:
          Content-Type: application/json
        body:
          name: service
          role: Admin
        status_code: 201
      register: orch_grafana_service_account

    - name: "Create Grafana Service Account Token"
      ansible.builtin.uri:
        url: "http://localhost:3000/api/serviceaccounts/{{ orch_grafana_service_account.json.id }}/tokens"
        url_username: admin
        url_password: "{{ orch_grafana_admin_password }}"
        force_basic_auth: true
        method: POST
        body_format: json
        headers:
          Content-Type: application/json
        body:
          name: initialisation-token
      register: orch_grafana_service_token

    - name: Write passwords to JSON file
      vars:
        json_pwds:
          "Grafana Orch Admin":
            "admin": "{{ orch_grafana_admin_password }}"
            "service": "{{ orch_grafana_service_token.json.key }}"
      ansible.builtin.copy:
        content: "{{ json_pwds | to_nice_json }}"
        dest: "/root/passwords.json"

    - name: "Add Prometheus data source to Grafana"
      community.grafana.grafana_datasource:
        name: "prometheus_ds"
        grafana_url: "http://localhost:3000"
        grafana_user: "admin"
        grafana_password: "{{ orch_grafana_admin_password }}"
        org_id: "1"
        ds_type: "prometheus"
        ds_url: "http://localhost:9090"
      register: orch_grafana_datasource_prometheus

    - name: "Add Grafana Stats Dashboard"
      vars:
        dashboard: "{{ lookup('file', 'templates/grafana/orchestrator_dashboard_stats.json') }}"
      ansible.builtin.uri:
        url: "http://localhost:3000/api/dashboards/db"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ orch_grafana_service_token.json.key }}"
          Content-Type: application/json
        unredirected_headers: [ Authorization ]
        body: "{{ dashboard|replace('DATABASE_UID', orch_grafana_datasource_prometheus.datasource.uid) }}"

    - name: "Add Grafana Contact Point"
      ansible.builtin.uri:
        url: "http://localhost:3000/api/v1/provisioning/contact-points"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ orch_grafana_service_token.json.key }}"
          Content-Type: application/json
        unredirected_headers: [ Authorization ]
        body:
          name: "Default Contact Point"
          type: "email"
          settings:
            addresses: "{{ mail_recipients }}"
        status_code: 202
      register: orch_grafana_contact_point

    - name: "Add Grafana Folder"
      ansible.builtin.uri:
        url: "http://localhost:3000/api/folders"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ orch_grafana_service_token.json.key }}"
          Content-Type: application/json
        unredirected_headers: [ Authorization ]
        body:
          description: "Alerts"
          title: "Alerts"
      register: orch_grafana_folder

    - name: "Add Grafana Alert Group"
      vars:
        rules: "{{ lookup('file', 'templates/grafana/orchestrator_alert_rules.json') }}"
      ansible.builtin.uri:
        url: "http://localhost:3000/api/v1/provisioning/folder/{{ orch_grafana_folder.json.uid }}/rule-groups/Alerts"
        method: PUT
        body_format: json
        headers:
          Authorization: "Bearer {{ orch_grafana_service_token.json.key }}"
          Content-Type: application/json
        unredirected_headers: [ Authorization ]
        body: "{{ rules|replace('DATABASE_UID', orch_grafana_datasource_prometheus.datasource.uid) }}"
