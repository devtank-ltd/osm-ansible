---

- name: Get customer encrypted passwords
  ansible.builtin.shell:
    cmd: "incus exec {{ customer_name }} -- cat /root/passwords-v2.json"
  register: passwords_file

- name: Get OSM key
  # TODO: move to variables
  ansible.builtin.stat:
    path: /srv/osm-lxc/orchestrator/master.key
  register: osm_key

- name: Generate OSM key
  when: not osm_key.stat.exists
  devtank_crypt:
    action: generate_key
  register: osm_master_key

- name: Store OSM key
  when: not osm_key.stat.exists
  ansible.builtin.copy:
    content: "{{ osm_master_key.output.key }}"
    dest: /srv/osm-lxc/orchestrator/master.key

- name: Set OSM key
  ansible.builtin.set_fact:
    osm_master_key: "{{ lookup('file', '/srv/osm-lxc/orchestrator/master.key') }}"

- name: Encrypt customer master key
  devtank_crypt:
    input_string: "{{ customer_key }}"
    action: encrypt
    key: "{{ osm_master_key }}"
  register: encrypted_customer_key

- name: Store customer secrets to Devtank DB
  devtank_db:
    db_username: "{{ db_conf.orchestrator.user }}"
    db_password: "{{ db_conf.orchestrator.password }}"
    db_host: "{{ db_conf.orchestrator.host }}"
    db_name: "{{ db_conf.orchestrator.database }}"
    method: add_customer_secrets
    customer_id: "{{ customer_id.output.id }}"
    key: "{{ encrypted_customer_key.output.string }}"
    data: "{{ passwords_file.stdout }}"
