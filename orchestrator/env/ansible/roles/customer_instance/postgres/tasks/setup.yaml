---

- name: Wait on Postgres
  shell: "timeout 30s bash -c 'while ! pg_isready; do sleep 1; done'"

# This block is run as the user postgres
- name: Postgres operations
  block:
    - name: Set postgres chirpstack user
      block:

        - name: Generate password
          ansible.builtin.set_fact:
            chirpstack_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=16, chars=['ascii_letters', 'digits'])}}"

        - name: Add chirpstack postgres user
          postgresql_user:
            name: "chirpstack"
            password: "{{ chirpstack_password }}"

        - name: Add chirpstack postgres user
          postgresql_user:
            name: "chirpstack"
            password: "{{ chirpstack_password }}"

      when: overwrite_passwords

    - name: Create chirpstack databases
      postgresql_db:
        name: "chirpstack"
        owner: "chirpstack"

    - name: Add extensions to chirpstack DB
      postgresql_ext:
        name: "{{ extension}}"
        login_db: chirpstack
      loop:
        - "pg_trgm"
        - "hstore"
      loop_control:
        loop_var: extension

  become: true
  become_user: postgres
