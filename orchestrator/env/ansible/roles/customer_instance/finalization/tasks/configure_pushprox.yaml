---

- name: DEBUG wg ip
  debug:
    msg: "main_wg_ip = {{ main_wg_ip | default('NOT SET') }}"

- name: Set pushprox proxy address
  ansible.builtin.replace:
    path: /etc/default/pushprox
    regexp: (\d{1,3}\.){3}\d{1,3}
    replace: "{{ main_wg_ip }}"

- name: Restart pushprox client
  ansible.builtin.systemd_service:
    state: restarted
    name: pushprox-client
