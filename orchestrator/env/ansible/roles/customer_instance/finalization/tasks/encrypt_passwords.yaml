---

- name: Generate customer master key
  devtank_crypt:
    action: generate_key
  register: customer_master_key

- name: Set customer master key
  ansible.builtin.set_fact:
    customer_master_key: "{{ customer_master_key.output.key }}"

- name: Encrypt timescaledb passwords
  devtank_crypt:
    input_string: "{{ timescaledb_passwords[item] }}"
    action: encrypt
    key: "{{ customer_master_key }}"
  loop:
    - "customer"
    - "devtank"
  register: encrypted_timescaledb_passwords

- name: Create new encrypted timescaledb passwords
  set_fact:
    enc_timescaledb_passwords: "{{ enc_timescaledb_passwords | default({}) | combine ({ item.item : item.output.string }) }}"
  loop: "{{ encrypted_timescaledb_passwords.results }}"

- name: Encrypt postgrest token
  devtank_crypt:
    input_string: "{{ postgres_api_token }}"
    action: encrypt
    key: "{{ customer_master_key }}"
  register: encrypted_postgres_api_token

- name: Create new encrypted postgres token
  set_fact:
    enc_postgres_token: "{{ encrypted_postgres_api_token.output.string }}"

- name: Encrypt chirpstack_password
  devtank_crypt:
    input_string: "{{ chirpstack_password }}"
    action: encrypt
    key: "{{ customer_master_key }}"
  register: encrypted_chirpstack_password

- name: Create new encrypted chirpstack passwords
  set_fact:
    enc_chirpstack_password: "{{ encrypted_chirpstack_password.output.string }}"

- name: Encrypt mosquitto password
  devtank_crypt:
    input_string: "{{ mosquitto_passwd }}"
    action: encrypt
    key: "{{ customer_master_key }}"
  register: encrypted_mosquitto_passwd

- name: Set encrypted mosquitto password
  set_fact:
    enc_mosquitto_passwd: "{{ encrypted_mosquitto_passwd.output.string }}"

- name: Encrypt grafana admin password
  devtank_crypt:
    input_string: "{{ grafana_admin_password }}"
    action: encrypt
    key: "{{ customer_master_key }}"
  register: encrypted_grafana_admin_password

- name: Set encrypted grafana admin password
  set_fact:
    enc_grafana_admin_password: "{{ encrypted_grafana_admin_password.output.string }}"

- name: Encrypt grafana_viewer_password
  devtank_crypt:
    input_string: "{{ grafana_viewer_password }}"
    action: encrypt
    key: "{{ customer_master_key }}"
  register: encrypted_grafana_viewer_password

- name: Set encrypted grafana viewer encrypted password
  set_fact:
    enc_grafana_viewer_password: "{{ encrypted_grafana_viewer_password.output.string }}"

- name: Encrypt chirpstack_admin_password
  devtank_crypt:
    input_string: "{{ chirpstack_admin_password }}"
    action: encrypt
    key: "{{ customer_master_key }}"
  register: encrypted_chirpstack_admin_password

- name: Set encrypted chirpstack admin encrypted password
  set_fact:
    enc_chirpstack_admin_password: "{{ encrypted_chirpstack_admin_password.output.string }}"
