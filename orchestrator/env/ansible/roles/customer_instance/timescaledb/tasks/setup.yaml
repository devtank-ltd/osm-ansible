- name: Insert schema version
  community.postgresql.postgresql_query:
    db: "{{ timescaledb_db }}"
    login_user: "{{ timescaledb_owner }}"
    login_password: "{{ timescaledb_passwords['devtank'] }}"
    login_host: 127.0.0.1
    query: >
      INSERT INTO generic VALUES (DEFAULT, 'schema_version', '{"version": "1.0.0"}');

- name: Insert default tariffs
  community.postgresql.postgresql_query:
    db: "{{ timescaledb_db }}"
    login_user: "{{ timescaledb_owner }}"
    login_password: "{{ timescaledb_passwords['devtank'] }}"
    login_host: 127.0.0.1
    query: >
      INSERT INTO tariffs VALUES
      (DEFAULT, 0.30, {{ item }}, '2020-01-01 00:00:00', null, 'elec', 0, 24),
      (DEFAULT, 0.30, {{ item }}, '2020-01-01 00:00:00', null, 'gas', 0, 24),
      (DEFAULT, 0.30, {{ item }}, '2020-01-01 00:00:00', null, 'water', 0, 24);
  loop: "{{ range(0, 7) | list }}"
