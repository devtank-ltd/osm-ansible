---

- name: Find all chirpstack configuration files
  ansible.builtin.find:
    path: /etc/chirpstack
    patterns: '*.toml'
    excludes: 'chirpstack'
  register: region

- name: Update PostgreSQL DSN
  ansible.builtin.replace:
    path: /etc/chirpstack/chirpstack.toml
    regexp: '(.*\/\/.*:).*(@.*)'
    replace: '\g<1>{{ chirpstack_password }}\g<2>'

- name: Add MQTT credentials to chirpstack configuration file
  ansible.builtin.lineinfile:
    path: /etc/chirpstack/chirpstack.toml
    search_string: '^\s+\[integration\.mqtt\]$'
    insertafter: "{{ item.after_re }}"
    line: "{{ item.line }}"
  loop:
    - { after_re: '\s+server\s*=', line: '    username = "{{ customer_name }}"'}
    - { after_re: '\s+username\s*=', line: '    password = "{{ mosquitto_passwd }}"'}
    - { after_re: '\s+json\s*=', line: '    event_topic = "osm/chirpstack/{{ "{{dev_eui}}" }}/measurements"' }
    - { after_re: '\s+event_topic\s*=', line: '    command_topic = "osm/chirpstack/{{ "{{dev_eui}}" }}/command"'}

- name: Add username to region configuration files
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: '(^\s+username\s*=\s*")"$'
    replace: '\g<1>{{ customer_name }}"'
  with_items: "{{ region.files }}"

- name: Add password to region configuration files
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: '(^\s+password\s*=\s*")"$'
    replace: '\g<1>{{ mosquitto_passwd }}"'
  with_items: "{{ region.files }}"

- name: Start and enable chirpstack services
  ansible.builtin.systemd:
    name: chirpstack
    state: restarted
    enabled: yes

- name: Wait for port 8080 to become open on the host
  ansible.builtin.wait_for:
    port: 8080
    timeout: 10

- name: Create chirpstack admin password
  ansible.builtin.set_fact:
    chirpstack_admin_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=16, chars=['ascii_letters', 'digits']) }}"

- name: Get chirpstack jwt token
  ansible.builtin.command:
    argv:
      - grpcurl
      - -plaintext
      - -d
      - '{"email": "admin", "password": "admin"}'
      - 127.0.0.1:8080
      - api.InternalService.Login
  register: chirpstack_api_output

- name: Parse chirpstack jwt token
  ansible.builtin.set_fact:
    chirpstack_api_token: "{{ chirpstack_api_output.stdout | from_json | json_query('jwt') }}"

- name: Print chirpstack jwt token
  ansible.builtin.debug:
    msg: "chirpstack API jwt token: {{ chirpstack_api_token }}"

- name: gRPC Get chirpstack users list
  ansible.builtin.command:
    argv:
      - grpcurl
      - -plaintext
      - -H
      - "Authorization: Bearer {{ chirpstack_api_token}}"
      - -d
      - '{"limit": 1}'
      - 127.0.0.1:8080
      - api.UserService/List
  register: grpc_output

- name: gRPC JSON output
  ansible.builtin.set_fact:
    users_list: "{{ grpc_output.stdout | from_json }}"

- name: Get admin UUID
  ansible.builtin.set_fact:
    admin_uuid: "{{ users_list.result[0].id }}"

- name: Print admin user ID
  ansible.builtin.debug:
    msg: "Admin UUID: {{ admin_uuid }}"

- name: Update chirpstack admin password
  ansible.builtin.command:
    argv:
      - grpcurl
      - -plaintext
      - -H
      - "Authorization: Bearer {{ chirpstack_api_token }}"
      - -d
      - '{"user_id": "{{ admin_uuid }}", "password": "{{ chirpstack_admin_password }}"}'
      - 127.0.0.1:8080
      - api.UserService/UpdatePassword

- name: Bind API to 0.0.0.0
  ansible.builtin.replace:
    path: /etc/chirpstack/chirpstack.toml
    regexp: '(^\s+bind\s*=\s*")[0-9.]+(:8080")'
    replace: '\g<1>0.0.0.0\g<2>'

- name: Start and enable chirpstack services
  ansible.builtin.systemd:
    name: chirpstack
    state: restarted
    enabled: yes
