---

- name: Configure mosquitto
  ansible.builtin.template:
    src: "{{ mosquitto_conf.key }}"
    dest: "{{ mosquitto_conf.value }}"
  loop:
    - { key: "acl.tpl", value: "/etc/mosquitto/acl" }
    - { key: "mosquitto.conf.tpl", value: "/etc/mosquitto/mosquitto.conf" }
    - { key: "security.conf.tpl", value: "/etc/mosquitto/conf.d/security.conf" }
  loop_control:
    loop_var: mosquitto_conf


- name: Generate random password
  ansible.builtin.set_fact:
    mosquitto_passwd: "{{ lookup('ansible.builtin.password', '/dev/null', length=16, chars=['ascii_letters', 'digits']) }}"
  when: mosquitto_passwd is undefined

- name: Print password
  ansible.builtin.debug:
    msg: "Moquitto password is: {{ mosquitto_passwd }}"

- name: Set password
  ansible.builtin.command: "mosquitto_passwd -c -b /etc/mosquitto/passwd {{ customer_name }} '{{ mosquitto_passwd }}'"
  # creates: /etc/mosquitto/passwd

- name: Set mode for mosquitto configuration files
  ansible.builtin.file:
    path: "{{ conf }}"
    owner: mosquitto
    group: mosquitto
    mode: '0700'
  loop:
    - /etc/mosquitto/passwd
    - /etc/mosquitto/acl
  loop_control:
    loop_var: conf

- name: Start and enable mosquitto
  ansible.builtin.systemd:
    name: mosquitto.service
    state: restarted
    enabled: yes
