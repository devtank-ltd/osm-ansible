- name: Create devtank customer
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Add customer records to PDNS database
      block:
      - name:  Add customer records to PDNS database
        include_role:
          name: pdns_management
          tasks_from: add


      - name: Create incus instance
        block:
          - name: Create incus instance
            include_role:
              name: incus_instance
              tasks_from: add

          - name: Add customer to devtank database
            include_role:
              name: db_management
              tasks_from: add

          # - name: Simulate failure on database
          #   ansible.builtin.fail:
          #     msg: "Failure on devtank database"

          - name: Add customer configuration to OSM host
            include_role:
              name: osm_host
              tasks_from: add

          - name: Simulate failure on customer configs
            ansible.builtin.fail:
              msg: "Failure on customer configs"

        rescue:
          - name: Rollback devtank database entries (if exist)
            include_role:
              name: db_management
              tasks_from: remove

          - name: Remove incus instance
            include_role:
              name: incus_instance
              tasks_from: remove

          - name: Remove customer configuration from OSM host
            include_role:
              name: osm_host
              tasks_from: remove

          - name: Rollback PDNS database entries
            include_role:
              name: pdns_management
              tasks_from: remove

          - name: Fail to stop further processing
            ansible.builtin.fail:
              msg: "Customer creatin failed. Rollback completed"

    - name: Final confirmation
      ansible.builtin.debug:
        msg: "All tasks completed successfully"
