---

- name: Get main cluster IP address
  set_fact:
    cluster_ip: "{{ ansible_default_ipv4.address }}"
  when: inventory_hostname == "vosmhost0"
  delegate_to: localhost
  delegate_facts: true

- name: Create apt keyring path
  file:
    path: /etc/apt/keyrings/
    mode: 0755
    state: directory

- name: Add Zabbly repo key
  copy:
    src: zabbly.asc
    dest: /etc/apt/keyrings/ansible-zabbly.asc
  notify: Refresh apt

- name: Get architecture
  shell: dpkg --print-architecture
  register: dpkg_architecture
  changed_when: false
  check_mode: no

- name: Add Zabbly package source
  template:
    src: sources.tpl
    dest: /etc/apt/sources.list.d/zabbly-incus-{{ incus_init["release"] }}.sources
  notify: Refresh apt

- name: FIXME install systemd-resolved
  apt:
    name: systemd-resolved
    install_recommends: no
    state: present

- name: FIXME dns
  ansible.builtin.shell: |
    systemctl stop systemd-resolved
    resolvectl dns {{ ansible_default_ipv4.interface }} {{ devtank.dns_server_ip }}

- name: FIXME Refresh apt as handler does not work
  apt:
    force_apt_get: yes
    update_cache: yes
    cache_valid_time: 0

- name: Install incus package
  apt:
    name: incus
    install_recommends: no
    state: present

- name: Install incus UI
  apt:
    name: incus-ui-canonical
    install_recommends: no
    state: present
  when: "(devtank['hostname'] == 'vosmhost0' and devtank['hostname'] != 'orchestrator')"

- name: Install btrfs tools
  ansible.builtin.package:
    name: btrfs-progs
    state: present

- name: Set uid allocation
  shell:
    cmd: "usermod root --add-subuids 1000000-1000999999"

- name: Set gid allocation
  shell:
    cmd: "usermod root --add-subgids 1000000-1000999999"

- name: Enable incus socket unit
  systemd:
    enabled: true
    name: incus.socket
    state: started

- name: Enable incus service unit
  systemd:
    enabled: true
    name: incus.service
    state: started

- name: Enable incus startup unit
  systemd:
    enabled: true
    name: incus-startup.service
    state: started

- name: Set client listen address
  shell:
    cmd: "incus --force-local config set core.https_address {{ ansible_default_ipv4.address|default(ansible_all_ipv4_addresses[0]) }}"

- name: Set cluster listen address
  shell:
    cmd: "incus --force-local config set cluster.https_address {{ hostvars['localhost']['cluster_ip'] }}"
  when: "(devtank['hostname'] == 'vosmhost0' and devtank['hostname'] != 'orchestrator')"

- name: Add storage pool
  shell:
    cmd: "incus storage create devtank {{ incus_init['storage']['driver'] }} source={{ incus_init['storage']['source'] }}"
  when: "(devtank['hostname'] == 'vosmhost0' and devtank['hostname'] != 'orchestrator')"

- name: Add storage pool description
  shell:
    cmd: "incus storage set --property devtank description=\"Devtank storage pool\""
  when: "(devtank['hostname'] == 'vosmhost0' and devtank['hostname'] != 'orchestrator')"
  ignore_errors: true

- name: Add storage pool to default profile
  shell:
    cmd: "incus profile device add default root disk path=/ pool=devtank"
  when: "(devtank['hostname'] == 'vosmhost0' and devtank['hostname'] != 'orchestrator')"

- name: Add network
  shell:
    cmd: "incus network create devtank --type={{ incus_init['network']['type'] }} ipv4.address={{ incus_init['network']['ipaddr'] }} ipv4.firewall=true ipv4.nat=true ipv6.address=none"
  when: "(devtank['hostname'] == 'vosmhost0' and devtank['hostname'] != 'orchestrator')"

- name: Add network description
  shell:
    cmd: "incus network set --property devtank description=\"Devtank bridged network\""
  when: "(devtank['hostname'] == 'vosmhost0' and devtank['hostname'] != 'orchestrator')"

- name: Add network to default profile
  shell:
    cmd: "incus profile device add default {{ incus_init['network']['iface'] }} nic network=devtank name={{ incus_init['network']['iface'] }}"
  when: "(devtank['hostname'] == 'vosmhost0' and devtank['hostname'] != 'orchestrator')"

- name: Bootstrap the cluster
  shell:
    cmd: "incus --force-local cluster enable {{ ansible_facts['hostname'] }}"
  when: "(devtank['hostname'] == 'vosmhost0' and devtank['hostname'] != 'orchestrator')"

- name: Create join tokens
  delegate_to: "{{ hostvars['localhost']['cluster_ip'] }}"
  shell:
    cmd: "incus --force-local --quiet cluster add {{ devtank['hostname'] }}"
  register: cluster_add
  when: "(devtank['hostname'] != 'vosmhost0' and devtank['hostname'] != 'orchestrator')"

- name: Wait until token is valid
  wait_for:
    timeout: 5
  delegate_to: localhost
  when: "cluster_add.changed"

- name: Join the cluster
  throttle: 1
  shell:
    cmd: "incus --force-local admin init --preseed"
    stdin: |-
      cluster:
        enabled: true
        cluster_address: {{ hostvars['localhost']['cluster_ip'] }}
        cluster_token: {{ cluster_add.stdout }}
        server_address: {{ ansible_default_ipv4.address }}
        member_config:
        - entity: storage-pool
          name: devtank
          key: source
          value: /srv/osm-lxc/incus

  when: "cluster_add.changed"

- name: Add devtank image server
  shell:
    cmd: "incus remote add devtank {{ incus_init['image']['url'] }} --protocol {{ incus_init['image']['protocol'] }}"
  when: "(devtank['hostname'] == 'vosmhost0' and devtank['hostname'] != 'orchestrator')"

- name: Set DNS for incus
  # TODO: use systemd config instead?
  ansible.builtin.shell: |
    resolvectl dns devtank {{ incus_init.network.ipaddr.split('/')[0] }} {{ hostvars['vosmhost0']['ansible_host'] }}
