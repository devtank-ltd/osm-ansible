---

- name: Get DB config
  command: cat /srv/osm-lxc/orchestrator/config.yaml
  register: db_conf

- name: Set DB config
  set_fact:
    db_conf: "{{ db_conf.stdout | from_yaml }}"

- name: Add wireguard info to Devtank DB
  ansible.mysql.mysql_query:
    login_db: "{{ db_conf.orchestrator.database }}"
    login_password: "{{ db_conf.orchestrator.password }}"
    login_user: "{{ db_conf.orchestrator.user }}"
    query: >
      INSERT INTO osm_wireguard (osm_hosts_id, public_key, private_key, ip_addr)
      SELECT id, '{{ item.value.pub_key }}', '{{ item.value.priv_key }}', '{{ item.value.ipaddr }}'
      FROM osm_hosts WHERE name = '{{ inventory_hostname }}'
  loop: "{{ wireguard_data | dict2items }}"
