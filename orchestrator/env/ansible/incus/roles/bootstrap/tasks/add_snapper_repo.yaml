---

- name: Set snapper repo version
  ansible.builtin.set_fact:
    snapper_repo_versions:
      bookworm: 12
      trixie: 13

- name: Determine snapper version for codename
  ansible.builtin.set_fact:
    snapper_repo_version: "{{ snapper_repo_versions[ansible_distribution_release] | default('13') }}"

- name: Download snapper GPG key
  ansible.builtin.get_url:
    url: "https://download.opensuse.org/repositories/filesystems:/snapper/Debian_{{ snapper_repo_version }}/Release.key"
    dest: "/tmp/snapper.key"
    mode: '0644'

- name: Convert key to dearmored format
  ansible.builtin.command: >
    gpg --dearmor -o /etc/apt/keyrings/filesystems_snapper.gpg /tmp/snapper.key
  args:
    creates: /etc/apt/keyrings/filesystems_snapper.gpg

- name: Add snapper repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/filesystems_snapper.gpg] http://download.opensuse.org/repositories/filesystems:/snapper/Debian_{{ snapper_repo_version }}/ /"
    filename: "filesystems_snapper"
    state: present

- name: Remove temporary Snapper key file
  ansible.builtin.file:
    path: /tmp/snapper.key
    state: absent

- name: Install snapper
  ansible.builtin.apt:
    pkg:
      - snapper
      - snapper-backup
