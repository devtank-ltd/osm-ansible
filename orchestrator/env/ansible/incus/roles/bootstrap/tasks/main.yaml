---

- name: Prepare main host
  when: inventory_hostname == "vosmhost0"
  block:
    - name: Set WireGuard interface
      ansible.builtin.set_fact:
        wg_if: "{{ ansible_default_ipv4.interface }}"

    - name: Add devtank repository
      block:
        - name: Create apt keyring path
          ansible.builtin.file:
            path: /etc/apt/keyrings/
            mode: 0755
            state: directory

        - name: Add Devtank GPG key
          ansible.builtin.copy:
            src: devtank.gpg
            dest: /etc/apt/keyrings/devtank.gpg

        - name: Add Devtank repository to apt source
          ansible.builtin.template:
            src: devtank.tpl
            dest: /etc/apt/sources.list.d/devtank.sources

    - name: Add packages for bookworm codename
      ansible.builtin.set_fact:
        main.packages: "{{ main.packages + bookworm_packages }}"
      when: ansible_distribution_release == 'bookworm' and inventory_hostname == 'orchestrator'
      vars:
        bookworm_packages:
          - software-properties-common

    - name: Install packages
      ansible.builtin.apt:
        pkg: "{{ main.packages }}"
        state: latest
        update_cache: yes

    - name: Install snapper
      ansible.builtin.include_tasks: add_snapper_repo.yaml
      when: inventory_hostname == 'orchestrator'

    - name: Clone OSM Ansible git repository
      ansible.builtin.git:
        repo: "{{ devtank.git_repo }}"
        dest: "{{ devtank.dir }}"
        single_branch: yes
        version: "{{ git_branch }}"

    - name: Generate master encryption key
      devtank_crypt:
        action: "generate_key"
      register: master_data

    - name: Write master key to file
      ansible.builtin.copy:
        content: "{{ master_data.output.key }}"
        dest: "{{ devtank.dir }}/orchestrator/master.key"

    - name: "Enable IP forwarding"
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        sysctl_set: true
        state: present
        reload: true

    - import_tasks: minica.yaml
    - import_tasks: pebble.yaml
    - import_tasks: db.yaml
    - import_tasks: query_exporter.yaml
    - import_tasks: prometheus.yaml
    - import_tasks: grafana.yaml

- name: Prepare osm host
  when: inventory_hostname != "orchestrator"
  block:
    - name: Check /srv directory for BTRFS
      ansible.builtin.shell: |
        if [[ -e /srv ]]; then
            srv_fs="$(df --output=fstype /srv | sed '/Type/d')"
            if [[ "$srv_fs" != 'btrfs' ]]; then
                echo "Requires btrfs /srv"
                exit 1
            fi
        else
            root_fs="$(df --output=fstype / | sed '/Type/d')"
            if [[ "$root_fs" != 'btrfs' ]]; then
                echo "Requires btrfs root or /srv"
                exit 1
            fi
            mkdir -v -p -m 0755 /srv
        fi
      args:
        executable: /bin/bash

    - name: Install packages
      ansible.builtin.apt:
        pkg: "{{ osmhost.packages }}"
        state: latest
        update_cache: yes

    - name: Include Snapper repo setup
      ansible.builtin.include_tasks: add_snapper_repo.yaml
      when: inventory_hostname != 'orchestrator'

    - name: Clone OSM Ansible git repository
      ansible.builtin.git:
        repo: "{{ devtank.git_repo }}"
        dest: "{{ devtank.dir }}"
        single_branch: yes
        version: "{{ git_branch }}"
      when: inventory_hostname != "vosmhost0"

    - name: Copy OSM Host files
      ansible.builtin.shell: rsync -a /srv/osm-lxc/root_overlay/ /

    - name: Update OSM Host overlay NGINX with hostname
      ansible.builtin.replace:
        path: /etc/nginx/nginx.conf
        regexp: 'OSM_HOST_NAME'
        replace: "{{ ansible_hostname }}"
      tags: pebble

    - name: Update OSM Host overlay NGINX with domain
      ansible.builtin.replace:
        path: /etc/nginx/nginx.conf
        regexp: 'OSM_DOMAIN'
        replace: "{{ osm_domain }}"
      tags: pebble
