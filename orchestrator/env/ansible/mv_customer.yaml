---

- name: Move {{ customer_name }} to {{ target_host }}
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    db_name: osm
    db_user: devtank
    db_host: localhost
    db_port: 5432
    data_dir: /tmp/data
    ansible_python_interpreter: python3
    transfer_port: 8443

    tables:
      - { name: "pg_sf", column: "_time", keys: "_time, osm_id" }
      - { name: "pg_sf_ds", column: "bucket", keys: "bucket, name, osm_name" }
      - { name: "pg_sf_ds_text", column: "bucket", keys: "bucket, name, osm_name" }
      - { name: "kwh", column: "bucket", keys: "bucket, name, osm_name" }
      - { name: "plscnt", column: "bucket", keys: "bucket, name, osm_name" }
      - { name: "scaled_current", column: "bucket", keys: "bucket, name, osm_name" }

  tasks:
    - name: Get customer instance info
      block:
        - name: Get devtank database config
          ansible.builtin.set_fact:
            db_conf: "{{ lookup('file', '/srv/osm-lxc/orchestrator/config.yaml') | from_yaml }}"
        - name: Get current OSM host from incus
          ansible.builtin.shell:
            cmd: "incus ls {{ customer_name }} -cL -fcsv"
          register: incus_result

        - name: Set current host from incus
          ansible.builtin.set_fact:
            osm_host: "{{ incus_result.stdout }}"

        - name: Get source host info
          devtank_db:
            db_conf: "{{ db_conf.orchestrator }}"
            method: get_host
            host_name: "{{ osm_host }}"
          register: src_host_info

        - name: Get destination host info
          devtank_db:
            db_conf: "{{ db_conf.orchestrator }}"
            method: get_host
            host_name: "{{ target_host }}"
          register: dst_host_info

        - name: Get OSM host domain
          # TODO: which host to use, or DB?
          #       is it possible to have different domains on different hosts?
          delegate_to: "{{ dst_host_info.output.host_ip }}"
          connection: ssh
          ansible.builtin.shell: |
            domain="$(find /etc/letsencrypt/live/ -maxdepth 1 -mindepth 1 -type d -printf '%P' -quit)"
            domain="${domain#*.}"
            echo "$domain"
          register: osm_domain

        - name: Set target domain
          ansible.builtin.set_fact:
            target_domain: "{{ osm_domain.stdout }}"

        - name: Get customer MQTT port
          devtank_db:
            db_conf: "{{ db_conf.orchestrator }}"
            method: get_customer_port
            customer_name: "{{ customer_name }}"
          register: result

        # TODO: use get_port_domain role (rework port task)
        - name: Set mqtt port
          ansible.builtin.set_fact:
            mqtt_port: "{{ result.output.mqtt_port }}"

# This should be more like : https://thomas-leister.de/en/move-incus-container-between-hosts-zfs/

    - name: Transfer {{ customer_name }} instance
      block:
        - name: Create transfer path on source host.
          ansible.builtin.shell: |
            incus config set core.https_address {{ src_host_info.output.host_ip }}:{{ transfer_port }}

        - name: Generate trust token on source host
          ansible.builtin.shell: |
            incus config trust add {{ osm_host }}
          register: trust_token_output

        - name: Add source host remote on the target host
          delegate_to: "{{ dst_host_info.output.host_ip }}"
          connection: ssh
          ansible.builtin.shell: |
            incus remote add {{ osm_host }} {{ src_host_info.output.host_ip }} --token {{ trust_token_output.stdout | trim }}

        - name: Create snapshot on the source host
          ansible.builtin.shell: |
            incus snapshot create {{ customer_name }}

        - name: Start initial transfer to the target host
          delegate_to: "{{ dst_host_info.output.host_ip }}"
          connection: ssh
          ansible.builtin.shell: |
            incus copy {{ osm_host }}:{{ customer_name }} {{ customer_name }} --stateless

        - name: Stop container on source host
          ansible.builtin.shell: |
            incus stop {{ customer_name }}

        - name: Create a second snapshot on the source host before final sync
          ansible.builtin.shell: |
            incus snapshot create {{ customer_name }}

        - name: Copy container from target host
          delegate_to: "{{ dst_host_info.output.host_ip }}"
          connection: ssh
          ansible.builtin.shell: |
            incus copy {{ osm_host }}:{{ customer_name }} {{ customer_name }} --refresh

        - name: Unset volatile.apply_template on target host
          delegate_to: "{{ dst_host_info.output.host_ip }}"
          connection: ssh
          ansible.builtin.shell: |
            incus config unset {{ customer_name }} volatile.apply_template

        - name: Start container on target host
          delegate_to: "{{ dst_host_info.output.host_ip }}"
          connection: ssh
          ansible.builtin.shell: |
            incus start {{ customer_name }}

        - name: Unset API on source host.
          ansible.builtin.shell: |
            incus config unset core.https_address

    - name: Configure OSM hosts
      block:
        - name: Get OSM host WireGuard IP address
          delegate_to: "{{ dst_host_info.output.host_ip }}"
          connection: ssh
          ansible.builtin.shell:
            cmd: "ip -o a s dev wg0 | sed -rn 's|.*inet\\s([0-9.]+).*|\\1|p'"
          register: osm_host_wg_ipaddr

        - name: Set OSM host Wireguard IP address
          ansible.builtin.set_fact:
            wg_ipaddr: "{{ osm_host_wg_ipaddr.stdout }}"

        - name: Configure target OSM host
          import_role:
            name: osm_host
            tasks_from: add
          vars:
            ansible_connection: ssh
          delegate_to: "{{ dst_host_info.output.host_ip }}"

        - name: Remove nginx configuration from the source host
          import_role:
            name: osm_host
            tasks_from: remove
          vars:
            ansible_connection: ssh
          delegate_to: "{{ src_host_info.output.host_ip }}"

        - name: Update customer host in devtank database
          devtank_db:
            db_conf: "{{ db_conf.orchestrator }}"
            method: update_customer_host
            customer_name: "{{ customer_name }}"
            osm_host_id: "{{ dst_host_info.output.host_id }}"

        - name: Update alias in PoweDNS database
          devtank_db:
            db_conf: "{{ db_conf.pdns }}"
            method: update_record
            customer_name: "{{ customer_name }}"
            domain: "{{ target_domain }}"
            host_name: "{{ dst_host_info.output.host_name }}"

        - name: Ping transferred instance (external)
          delegate_to: "{{ dst_host_info.output.host_ip }}"
          connection: ssh
          ansible.builtin.shell:
            ping -c3 -W1 "{{customer_name}}.{{ target_domain }}"

        - name: Extract pool name for container
          delegate_to: "{{ dst_host_info.output.host_ip }}"
          ansible.builtin.shell: |
            incus config show {{ customer_name }} --expanded | sed -rn 's|.*pool: (.*)$|\1|p'
          register: pool_name
          changed_when: false

        - name: Create snapper config
          delegate_to: "{{ dst_host_info.output.host_ip }}"
          connection: ssh
          ansible.builtin.shell:
            snapper --debug -v -c {{ customer_name }} create-config /var/lib/incus/storage-pools/{{ pool_name.stdout }}/containers/{{ customer_name }}
          args:
            executable: /bin/bash

        - name: Get backup host IP address
          ansible.builtin.set_fact:
            backup_host: "{{ osmbackup | default(ansible_default_ipv4.address) }}"

        - name: Create snapper-backup configuration
          delegate_to: "{{ dst_host_info.output.host_ip }}"
          connection: ssh
          ansible.builtin.copy:
            dest: /etc/snapper/backup-configs/{{ customer_name }}.json
            content: |
              {
                  "config": "{{ customer_name }}",
                  "target-mode": "ssh-push",
                  "automatic": true,
                  "source-path": "/var/lib/incus/storage-pools/{{ pool_name.stdout }}/containers/{{ customer_name }}",
                  "target-path": "/srv/backups/incus/{{ customer_name }}",
                  "ssh-host": "{{ backup_host }}",
                  "ssh-user": "root",
                  "ssh-identity": "/root/.ssh/id_ed25519"
              }
            mode: '0644'
            owner: root
            group: root
