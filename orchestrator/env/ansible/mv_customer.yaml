---

- name: Move {{ customer_name }} to {{ target_host }}
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    db_name: osm
    db_user: devtank
    db_host: localhost
    db_port: 5432
    data_dir: /tmp/data
    ansible_python_interpreter: python3
    transfer_port: 8443

    tables:
      - { name: "pg_sf", column: "_time", keys: "_time, osm_id" }
      - { name: "pg_sf_ds", column: "bucket", keys: "bucket, name, osm_name" }
      - { name: "pg_sf_ds_text", column: "bucket", keys: "bucket, name, osm_name" }
      - { name: "kwh", column: "bucket", keys: "bucket, name, osm_name" }
      - { name: "plscnt", column: "bucket", keys: "bucket, name, osm_name" }
      - { name: "scaled_current", column: "bucket", keys: "bucket, name, osm_name" }

  tasks:
    - name: Get customer instance info
      block:
        - name: Get devtank database config
          ansible.builtin.set_fact:
            db_conf: "{{ lookup('file', '/srv/osm-lxc/orchestrator/config.yaml') | from_yaml }}"
        - name: Get current OSM host from incus
          ansible.builtin.shell:
            cmd: "incus ls {{ customer_name }} -cL -fcsv"
          register: incus_result

        - name: Set current host from incus
          ansible.builtin.set_fact:
            osm_host: "{{ incus_result.stdout }}"

        - name: Check if source and target hosts are in the same cluster
          ansible.builtin.shell: |
            incus cluster list -fcsv --columns n 2>/dev/null || echo ""
          register: cluster_check
          changed_when: false
          failed_when: false

        - name: Fail if hosts are not both in a cluster together
          ansible.builtin.assert:
            that:
              - osm_host in cluster_check.stdout_lines
              - target_host in cluster_check.stdout_lines
            fail_msg: >-
              Cannot move {{ customer_name }}: source host '{{ osm_host }}' and/or target host
              '{{ target_host }}' are not members of the same Incus cluster.
            success_msg: "Confirmed both hosts are cluster members — proceeding with move."

        - name: Get source host info
          devtank_db:
            db_conf: "{{ db_conf.orchestrator }}"
            method: get_host
            host_name: "{{ osm_host }}"
          register: src_host_info

        - name: Get destination host info
          devtank_db:
            db_conf: "{{ db_conf.orchestrator }}"
            method: get_host
            host_name: "{{ target_host }}"
          register: dst_host_info

        - name: Get OSM host domain
          # TODO: which host to use, or DB?
          #       is it possible to have different domains on different hosts?
          delegate_to: "{{ dst_host_info.output.host_ip }}"
          connection: ssh
          ansible.builtin.shell: |
            domain="$(find /etc/letsencrypt/live/ -maxdepth 1 -mindepth 1 -type d -printf '%P' -quit)"
            domain="${domain#*.}"
            echo "$domain"
          register: osm_domain

        - name: Set target domain
          ansible.builtin.set_fact:
            target_domain: "{{ osm_domain.stdout }}"

        - name: Get customer MQTT port
          devtank_db:
            db_conf: "{{ db_conf.orchestrator }}"
            method: get_customer_port
            customer_name: "{{ customer_name }}"
          register: result

        # TODO: use get_port_domain role (rework port task)
        - name: Set mqtt port
          ansible.builtin.set_fact:
            mqtt_port: "{{ result.output.mqtt_port }}"

    - name: Take and verify a fresh backup before touching any snapshots
      block:
        - name: Get backup host IP address
          ansible.builtin.set_fact:
            backup_host: "{{ osmbackup | default(ansible_default_ipv4.address) }}"

        - name: Take a fresh snapshot on the source
          ansible.builtin.shell: |
            snapper -c {{ customer_name }} create --description "pre-move backup" --print-number
          register: fresh_snapshot

        - name: Set fresh snapshot number fact
          ansible.builtin.set_fact:
            fresh_snapshot_number: "{{ fresh_snapshot.stdout | trim | int }}"

        - name: Transfer the fresh snapshot to the backup host
          ansible.builtin.shell: |
            snbk -b {{ customer_name }} transfer

        - name: Check transfer status via snbk
          ansible.builtin.shell: |
            snbk -b {{ customer_name }} --jsonout list
          register: snbk_list
          changed_when: false

        - name: Parse snbk list output
          ansible.builtin.set_fact:
            snbk_list_json: "{{ (snbk_list.stdout | from_json)['snapshots'] }}"

        - name: Fail if the fresh snapshot did not transfer successfully
          ansible.builtin.assert:
            that:
              - snbk_list_json | selectattr('number', 'equalto', fresh_snapshot_number) | map(attribute='target-state') | list | first | default('') == 'valid'
            fail_msg: >-
              Snapshot {{ fresh_snapshot_number }} for {{ customer_name }} did not reach
              {{ backup_host }} in a valid state. Refusing to delete source snapshots.
            success_msg: >-
              Confirmed snapshot {{ fresh_snapshot_number }} for {{ customer_name }}
              is valid on {{ backup_host }}.

    - name: Prepare source instance for transfer
      block:
        - name: Get pool name for source instance
          ansible.builtin.shell: |
            incus config show {{ customer_name }} --expanded | sed -rn 's|.*pool: (.*)$|\1|p'
          register: src_pool_name
          changed_when: false

        # readonly snapshot subvolumes on the target causes a fail
        # when any snapshot exists on the source. We've just confirmed
        # the latest snapshot is on backup_host. So we move them to an
        # archive directory in case they're needed later.
        - name: List snapper snapshots on the source host before transfer
          ansible.builtin.shell: |
            snapper -c {{ customer_name }} list --columns number | tail -n +3 | grep -v '^0$'
          register: pre_transfer_snapshot_numbers
          changed_when: false
          failed_when: false

        - name: Create snapshot archive directory on source host
          ansible.builtin.shell: |
            mkdir -p /var/lib/incus/storage-pools/{{ src_pool_name.stdout }}/snapshot-archive/{{ customer_name }}/{{ item }}
          loop: "{{ pre_transfer_snapshot_numbers.stdout_lines | default([]) }}"

        - name: Archive pre move snapshot subvolumes via btrfs send/receive
          ansible.builtin.shell: |
            btrfs send /var/lib/incus/storage-pools/{{ src_pool_name.stdout }}/containers/{{ customer_name }}/.snapshots/{{ item }}/snapshot \
              | btrfs receive /var/lib/incus/storage-pools/{{ src_pool_name.stdout }}/snapshot-archive/{{ customer_name }}/{{ item }}
          loop: "{{ pre_transfer_snapshot_numbers.stdout_lines | default([]) }}"

        - name: Copy snapshot metadata to the archived subvolume
          ansible.builtin.shell: |
            cp /var/lib/incus/storage-pools/{{ src_pool_name.stdout }}/containers/{{ customer_name }}/.snapshots/{{ item }}/info.xml \
               /var/lib/incus/storage-pools/{{ src_pool_name.stdout }}/snapshot-archive/{{ customer_name }}/{{ item }}/info.xml
          loop: "{{ pre_transfer_snapshot_numbers.stdout_lines | default([]) }}"
          failed_when: false

        - name: Delete the leftover snapshot subvolume from .snapshots
          ansible.builtin.shell: |
            btrfs subvolume delete /var/lib/incus/storage-pools/{{ src_pool_name.stdout }}/containers/{{ customer_name }}/.snapshots/{{ item }}/snapshot
          loop: "{{ pre_transfer_snapshot_numbers.stdout_lines | default([]) }}"

        - name: Remove empty .snapshots directory
          ansible.builtin.shell: |
            rm -rf /var/lib/incus/storage-pools/{{ src_pool_name.stdout }}/containers/{{ customer_name }}/.snapshots/{{ item }}
          loop: "{{ pre_transfer_snapshot_numbers.stdout_lines | default([]) }}"

    - name: Transfer {{ customer_name }} instance
      block:
        - name: Copy container while still running
          ansible.builtin.shell: |
            incus copy {{ customer_name }} {{ customer_name }}-migrating --target {{ target_host }} --stateless

        - name: Stop instance before cluster move
          ansible.builtin.shell: |
            incus stop {{ customer_name }}

        - name: Sync the changes
          ansible.builtin.shell: |
            incus copy {{ customer_name }} {{ customer_name }}-migrating --target {{ target_host }} --stateless --refresh

        - name: Delete the old instance
          ansible.builtin.shell: |
            incus delete {{ customer_name }}

        - name: Rename new instance
          delegate_to: "{{ dst_host_info.output.host_ip }}"
          connection: ssh
          ansible.builtin.shell: |
            incus rename {{ customer_name }}-migrating {{ customer_name }}

        - name: Start instance on target host
          delegate_to: "{{ dst_host_info.output.host_ip }}"
          connection: ssh
          ansible.builtin.shell: |
            incus start {{ customer_name }}

    - name: Configure OSM hosts
      block:
        - name: Get OSM host WireGuard IP address
          delegate_to: "{{ dst_host_info.output.host_ip }}"
          connection: ssh
          ansible.builtin.shell:
            cmd: "ip -o a s dev wg0 | sed -rn 's|.*inet\\s([0-9.]+).*|\\1|p'"
          register: osm_host_wg_ipaddr

        - name: Set OSM host Wireguard IP address
          ansible.builtin.set_fact:
            wg_ipaddr: "{{ osm_host_wg_ipaddr.stdout }}"

        - name: Configure target OSM host
          import_role:
            name: osm_host
            tasks_from: add
          vars:
            ansible_connection: ssh
          delegate_to: "{{ dst_host_info.output.host_ip }}"

        - name: Remove nginx configuration from the source host
          import_role:
            name: osm_host
            tasks_from: remove
          vars:
            ansible_connection: ssh
          delegate_to: "{{ src_host_info.output.host_ip }}"

        - name: Update customer host in devtank database
          devtank_db:
            db_conf: "{{ db_conf.orchestrator }}"
            method: update_customer_host
            customer_name: "{{ customer_name }}"
            osm_host_id: "{{ dst_host_info.output.host_id }}"

        - name: Update alias in PoweDNS database
          devtank_db:
            db_conf: "{{ db_conf.pdns }}"
            method: update_record
            customer_name: "{{ customer_name }}"
            domain: "{{ target_domain }}"
            host_name: "{{ dst_host_info.output.host_name }}"

        - name: Ping transferred instance (external)
          delegate_to: "{{ dst_host_info.output.host_ip }}"
          connection: ssh
          ansible.builtin.shell:
            ping -c3 -W1 "{{customer_name}}.{{ target_domain }}"

        - name: Extract pool name for container
          delegate_to: "{{ dst_host_info.output.host_ip }}"
          ansible.builtin.shell: |
            incus config show {{ customer_name }} --expanded | sed -rn 's|.*pool: (.*)$|\1|p'
          register: pool_name
          changed_when: false

        - name: Check if .snapshots subvolume already exists
          delegate_to: "{{ dst_host_info.output.host_ip }}"
          connection: ssh
          ansible.builtin.stat:
            path: "/var/lib/incus/storage-pools/{{ pool_name.stdout }}/containers/{{ customer_name }}/.snapshots"
          register: snapshots_subvol_check

        - name: List nested subvolumes inside .snapshots
          delegate_to: "{{ dst_host_info.output.host_ip }}"
          connection: ssh
          ansible.builtin.shell: |
            btrfs subvolume list -o /var/lib/incus/storage-pools/{{ pool_name.stdout }}/containers/{{ customer_name }}/.snapshots 2>/dev/null | awk '{print $NF}'
          register: nested_subvols
          when: snapshots_subvol_check.stat.exists
          changed_when: false

        - name: Delete nested snapshot subvolumes first
          delegate_to: "{{ dst_host_info.output.host_ip }}"
          connection: ssh
          ansible.builtin.shell: |
            btrfs subvolume delete "/{{ item }}"
          loop: "{{ nested_subvols.stdout_lines | default([]) }}"
          when: snapshots_subvol_check.stat.exists

        - name: Remove pre-existing .snapshots subvolume before snapper init
          delegate_to: "{{ dst_host_info.output.host_ip }}"
          connection: ssh
          ansible.builtin.shell: |
            btrfs subvolume delete /var/lib/incus/storage-pools/{{ pool_name.stdout }}/containers/{{ customer_name }}/.snapshots
          when: snapshots_subvol_check.stat.exists

        - name: Create snapper config
          delegate_to: "{{ dst_host_info.output.host_ip }}"
          connection: ssh
          ansible.builtin.shell:
            snapper --debug -v -c {{ customer_name }} create-config /var/lib/incus/storage-pools/{{ pool_name.stdout }}/containers/{{ customer_name }}

        - name: Create snapper-backup configuration
          delegate_to: "{{ dst_host_info.output.host_ip }}"
          connection: ssh
          ansible.builtin.copy:
            dest: /etc/snapper/backup-configs/{{ customer_name }}.json
            content: |
              {
                  "config": "{{ customer_name }}",
                  "target-mode": "ssh-push",
                  "automatic": true,
                  "source-path": "/var/lib/incus/storage-pools/{{ pool_name.stdout }}/containers/{{ customer_name }}",
                  "target-path": "/srv/backups/incus/{{ customer_name }}",
                  "ssh-host": "{{ backup_host }}",
                  "ssh-user": "root",
                  "ssh-identity": "/root/.ssh/id_ed25519"
              }
            mode: '0644'
            owner: root
            group: root

        # Take a fresh local snapshot then immediately push it to backup_host
        - name: Take a fresh snapshot on target host
          delegate_to: "{{ dst_host_info.output.host_ip }}"
          connection: ssh
          ansible.builtin.shell: |
            snapper -c {{ customer_name }} create --description "post-move backup" --print-number
          register: post_move_snapshot
          when: (pre_transfer_snapshot_numbers.stdout_lines | default([]) | length) > 0

        - name: Transfer the post-move snapshot to the backup host
          delegate_to: "{{ dst_host_info.output.host_ip }}"
          connection: ssh
          ansible.builtin.shell: |
            snbk -b {{ customer_name }} transfer
          when: (pre_transfer_snapshot_numbers.stdout_lines | default([]) | length) > 0

        - name: Check post-move transfer status via snbk
          delegate_to: "{{ dst_host_info.output.host_ip }}"
          connection: ssh
          ansible.builtin.shell: |
            snbk -b {{ customer_name }} --jsonout list
          register: post_move_snbk_list
          changed_when: false
          when: (pre_transfer_snapshot_numbers.stdout_lines | default([]) | length) > 0

        - name: Fail if the post-move snapshot did not transfer successfully
          ansible.builtin.assert:
            that:
              - >-
                (post_move_snbk_list.stdout | from_json)['snapshots']
                | selectattr('number', 'equalto', post_move_snapshot.stdout | trim | int)
                | map(attribute='target-state') | list | first | default('') == 'valid'
            fail_msg: >-
              Post-move snapshot {{ post_move_snapshot.stdout | trim }} for {{ customer_name }}
              did not reach {{ backup_host }} in a valid state.
            success_msg: >-
              Confirmed post-move snapshot {{ post_move_snapshot.stdout | trim }} for
              {{ customer_name }} is valid on {{ backup_host }}.
          when: (pre_transfer_snapshot_numbers.stdout_lines | default([]) | length) > 0

        - name: Remove stale snapper-backup configuration from the source host
          delegate_to: "{{ src_host_info.output.host_ip }}"
          connection: ssh
          ansible.builtin.file:
            path: /etc/snapper/backup-configs/{{ customer_name }}.json
            state: absent
