---

- name: Generate customer master key
  devtank_crypt:
    action: generate_key
  register: master_key

- name: Set customer master key
  ansible.builtin.set_fact:
    master_key: "{{ master_key.output.key }}"

- name: Encrypt influx passwords
  devtank_crypt:
    input_string: "{{ influx_passwords[item] }}"
    action: encrypt
    key: "{{ master_key }}"
  loop:
    - "chirpstack"
    - "customer"
    - "devtank"
    - "grafana"
  register: encrypted_influx_passwords

- name: Create new encrypted influx passwords
  set_fact:
    enc_influx_passwords:
      "{{ enc_influx_passwords | default({}) | combine ({ item.item : item.output.string }) }}"
  loop: "{{ encrypted_influx_passwords.results }}"

- name: Encrypt influx token
  devtank_crypt:
    input_string: "{{ influx_token }}"
    action: encrypt
    key: "{{ master_key }}"
  register: encrypted_influx_token

- name: Set encrypted influx token
  set_fact:
    enc_influx_token: "{{ encrypted_influx_token.output.string }}"

- name: Encrypt postgres_passwords
  devtank_crypt:
    input_string: "{{ postgres_passwords[item] }}"
    action: encrypt
    key: "{{ master_key }}"
  loop:
    - "chirpstack_as"
    - "chirpstack_ns"
  register: encrypted_postgres_passwords

- name: Create new encrypted postgres passwords
  set_fact:
    enc_postgres_passwords:
      "{{ enc_postgres_passwords | default({}) | combine ({ item.item : item.output.string }) }}"
  loop: "{{ encrypted_postgres_passwords.results }}"

- name: Encrypt mosquitto password
  devtank_crypt:
    input_string: "{{ mosquitto_passwd }}"
    action: encrypt
    key: "{{ master_key }}"
  register: encrypted_mosquitto_passwd

- name: Set encrypted mosquitto password
  set_fact:
    enc_mosquitto_passwd: "{{ encrypted_mosquitto_passwd.output.string }}"

- name: Encrypt grafana admin password
  devtank_crypt:
    input_string: "{{ grafana_admin_password }}"
    action: encrypt
    key: "{{ master_key }}"
  register: encrypted_grafana_admin_password

- name: Set encrypted grafana admin password
  set_fact:
    enc_grafana_admin_password: "{{ encrypted_grafana_admin_password.output.string }}"

- name: Encrypt grafana_viewer_password
  devtank_crypt:
    input_string: "{{ grafana_viewer_password }}"
    action: encrypt
    key: "{{ master_key }}"
  register: encrypted_grafana_viewer_password

- name: Set encrypted grafana viewer encrypted password
  set_fact:
    enc_grafana_viewer_password: "{{ encrypted_grafana_viewer_password.output.string }}"

- name: Encrypt chirpstack_admin_password
  devtank_crypt:
    input_string: "{{ chirpstack_admin_password }}"
    action: encrypt
    key: "{{ master_key }}"
  register: encrypted_chirpstack_admin_password

- name: Set encrypted chirpstack admin encrypted password
  set_fact:
    enc_chirpstack_admin_password: "{{ encrypted_chirpstack_admin_password.output.string }}"
