- name: Configure Prometheus node exporter systemd collector
  ansible.builtin.lineinfile:
    path: "{{ exporter_default_path }}"
    regexp: '(^ARGS=").*("$)'
    line: \g<1>{{ exporter_systemd_args }}\g<2>
    backrefs: yes

- name: Restart Prometheus node exporter
  ansible.builtin.systemd_service:
    state: restarted
    name: prometheus-node-exporter
