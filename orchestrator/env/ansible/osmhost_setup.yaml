- name: Check for btrfs /srv
  shell: |
    if [[ -e /srv ]]; then
        srv_fs="$(df --output=fstype /srv | sed '/Type/d')"
        if [[ "$srv_fs" != 'btrfs' ]]; then
            echo "Requires btrfs /srv"
            exit 1
        fi
    else
        root_fs="$(df --output=fstype / | sed '/Type/d')"
        if [[ "$root_fs" != 'btrfs' ]]; then
            echo "Requires btrfs root or /srv"
            exit 1
        fi
        mkdir -v -p -m 0755 /srv
    fi
  args:
    executable: /bin/bash

- name: Install required packages
  apt:
    name:
      - ansible
      - btrfs-progs
      - certbot
      - git
      - libbsd-dev
      - libglib2.0-dev
      - libsqlite3-dev
      - libxxhash-dev
      - pandoc
      - prometheus-node-exporter
      - rsync
      - sudo
      - ufw
      - vim
      - wireguard
    update_cache: yes

- name: Clone OSM Ansible git repo.
  ansible.builtin.git:
    repo: https://git.devtank.co.uk/Devtank/osm-ansible.git
    dest: /srv/osm-lxc
    single_branch: yes
    version: "{{ osm_ansible_branch }}"

- name: Add OSM orchestrator user
  ansible.builtin.user:
    name: osm_orchestrator
    comment: OSM Orchestrator
    create_home: yes
    group: users

- name: Install NGINX required packages
  apt:
    name:
      - nginx
      - libnginx-mod-stream
      - python3-certbot-nginx
    update_cache: yes

- name: Fetch, build and install duperemove
  block:
    - name: Fetch duperemove
      ansible.builtin.git:
        repo: https://github.com/markfasheh/duperemove.git
        dest: /srv/osm-lxc/orchestrator/env/dist/duperemove
        version: "v0.14.1"

    - name: Build and install duperemove
      shell: |
        make && make install
      args:
        chdir: /srv/osm-lxc/orchestrator/env/dist/duperemove

- name: Add netdata main config
  copy:
    src: templates/netdata/netdata.conf
    dest: /etc/netdata/netdata.conf

- name: Add netdata cgroups config
  copy:
    src: templates/netdata/cgroups.conf
    dest: /etc/netdata/python.d/cgroups.conf

- name: Restart netdata
  ansible.builtin.service:
    name: netdata
    state: restarted

- name: Apply OSM Host overlay.
  shell: rsync -a /srv/osm-lxc/root_overlay/ /

- name: Update OSM Host overlay NGINX with hostname
  ansible.builtin.replace:
    path: /etc/nginx/nginx.conf
    regexp: 'OSM_HOST_NAME'
    replace: "{{ osm_host_name }}"
  tags: pebble

- name: Update OSM Host overlay NGINX with domain
  ansible.builtin.replace:
    path: /etc/nginx/nginx.conf
    regexp: 'OSM_DOMAIN'
    replace: "{{ osm_domain }}"
  tags: pebble
