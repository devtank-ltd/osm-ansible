- name: Remove devtank customer
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Set devtank db conf
      ansible.builtin.set_fact:
        db_conf: "{{ lookup('file', '/srv/osm-lxc/orchestrator/config.yaml') | from_yaml }}"

    - name: Get customer from devtank database
      import_role:
        name: db_management
        tasks_from: get_customer_info

    - name: Set OSM IP address
      ansible.builtin.set_fact:
        osm_ip: "{{ customer_info.output.host_ipaddr }}"

    - name: Task name
      stat:
        path: "/etc/snapper/configs/{{ customer_name }}"
      register: snapper_filedata

    - name: Remove snapper config for {{ customer_name }} customer
      delegate_to: "{{ osm_ip }}"
      connection: ssh
      ansible.builtin.shell:
        snapper -c "{{ customer_name }}" delete-config
      when: snapper_filedata.stat.exists

    - name: Remove snapper-backup config for {{ customer_name }} customer
      delegate_to: "{{ osm_ip }}"
      connection: ssh
      ansible.builtin.file:
        path: /etc/snapper/backup-configs/{{ customer_name }}.json
        state: absent
      ignore_errors: true

    - name: Remove incus instance
      import_role:
        name: incus_instance
        tasks_from: remove

    - name: Remove customer configuration from OSM host
      import_role:
        name: osm_host
        tasks_from: remove
      vars:
        ansible_connection: ssh
      delegate_to: "{{ osm_ip }}"

    - name: Remove customer from devtank database
      import_role:
        name: db_management
        tasks_from: remove

    - name: Remove customer ailases from PDNS database
      import_role:
        name: pdns_management
        tasks_from: remove

- name: Remove customer from Prometheus
  hosts: localhost
  become: yes
  connection: local
  gather_facts: yes

  vars:
    prometheus_config: "/etc/prometheus/prometheus.yml"

  tasks:
    - name: Remove {{ customer_name }} from Prometheus
      ansible.builtin.blockinfile:
        path: "{{ prometheus_config }}"
        # append_newline: yes <--- since ansible-core v2.16
        backup: yes
        marker: "# {mark} ORCHESTRATOR MANAGED {{ customer_name }}"
        block: ""

    - name: Restart Prometheus
      ansible.builtin.systemd_service:
        state: restarted
        name: prometheus
