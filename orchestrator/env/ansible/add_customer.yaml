- name: Create devtank customer
  hosts: localhost
  connection: local
  gather_facts: yes

  vars:
    main_host: localhost
    base_image: "devtank:debian/trixie/default"

  tasks:
    - name: Init customer instance
      import_role:
        name: incus_instance
        tasks_from: add
      vars:
        customer_name: "{{ customer_name }}"
        target_host: "{{ target_host }}"

    - name: Get devtank database config
      ansible.builtin.set_fact:
        db_conf: "{{ lookup('file', '/srv/osm-lxc/orchestrator/config.yaml') | from_yaml }}"

    - name: Get init data from devtank database
      block:
        - name: Get data MQTT and domain from database
          import_role:
            name: db_management
            tasks_from: get_port_domain_info
          vars:
            mqtt_init_port: 8883

      rescue:
        - name: Cleanup incus instance
          ansible.builtin.import_role:
            name: incus_instance
            tasks_from: remove

        - name: Fail after cleanup
          ansible.builtin.fail:
            msg: "Failed to get init data from devtank database"

    - name: Setup databases and OSM host
      block:
        - name: Add customer alias to PDNS database
          import_role:
            name: pdns_management
            tasks_from: add
          vars:
            ansible_connection: local
            db_conf: "{{ db_conf.pdns }}"
          delegate_to: "{{ main_host }}"

        - name: Add customer configuration to OSM host
          import_role:
            name: osm_host
            tasks_from: add
          vars:
            ansible_connection: ssh
          delegate_to: "{{ osm_ip }}"

        - name: Add customer to devtank database
          import_role:
            name: db_management
            tasks_from: add
          vars:
            ansible_connection: local
          delegate_to: "{{ main_host }}"

      rescue:
        - name: Rollback devtank database entries (if exist)
          import_role:
            name: db_management
            tasks_from: remove
          ignore_errors: true
          vars:
            ansible_connection: local
          delegate_to: "{{ main_host }}"

        - name: Remove incus instance
          import_role:
            name: incus_instance
            tasks_from: remove
          ignore_errors: true
          vars:
            ansible_connection: local
          delegate_to: "{{ main_host }}"

        - name: Remove customer configuration from OSM host
          import_role:
            name: osm_host
            tasks_from: remove
          vars:
            ansible_connection: ssh
          delegate_to: "{{ osm_ip }}"
          ignore_errors: true

        - name: Rollback PDNS database entries
          import_role:
            name: pdns_management
            tasks_from: remove
          ignore_errors: true
          vars:
            ansible_connection: local
          delegate_to: "{{ main_host }}"

        - name: Fail to stop further processing
          ansible.builtin.fail:
            msg: "Customer creatin failed. Rollback completed"

- name: Setup customer services
  hosts: "{{ customer_name }}"
  connection: community.general.incus

  vars:
    overwrite_passwords: true
    timescaledb_owner: devtank
    timescaledb_db: osm

  tasks:
    - name: Configure customer services
      block:
        - name: Set variables from previous plays
          ansible.builtin.set_fact:
            le_domain: "{{ hostvars['localhost'].target_domain }}"
            main_wg_ip: "{{ hostvars['localhost']['ansible_wg0'].ipv4.address }}"
            osm_ip: "{{ hostvars['localhost']['osm_ip'] }}"

        - name: Include customer service roles
          include_role:
            name: "customer_instance/{{ item }}"
          loop:
            - mosquitto
            - postgres
            - timescaledb
            - chirpstack
            - grafana
            - prometheus_node_exporter
            - mqtt_postgres_inserter
            - osm_exporter
            - finalization

      rescue:
        - name: Get devtank database config
          ansible.builtin.set_fact:
            db_conf: "{{ lookup('file', '/srv/osm-lxc/orchestrator/config.yaml') | from_yaml }}"
          delegate_to: localhost
          run_once: true
          connection: local

        - name: Get incus host
          devtank_db:
            db_conf: "{{ db_conf.orchestrator }}"
            method: get_host_name_by_customer
            customer_name: "{{ customer_name }}"
          delegate_to: localhost
          run_once: true
          connection: local
          register: incus_location

        - name: Set pdns_alias
          ansible.builtin.set_fact:
            pdns_alias: "{{ incus_location.output.host_name }}"

        - name: Rollback devtank database entries (if exist)
          import_role:
            name: db_management
            tasks_from: remove
          ignore_errors: true
          delegate_to: localhost
          run_once: true
          connection: local

        - name: Rollback PDNS database entries
          import_role:
            name: pdns_management
            tasks_from: remove
          ignore_errors: true
          delegate_to: localhost
          run_once: true
          connection: local

        - name: Remove incus instance
          import_role:
            name: incus_instance
            tasks_from: remove
          ignore_errors: true

        - name: Remove customer configuration from OSM host
          import_role:
            name: osm_host
            tasks_from: remove
          vars:
            ansible_connection: ssh
          delegate_to: "{{ osm_ip }}"
          ignore_errors: true

        - name: Recover customer services fail
          ansible.builtin.fail:
            msg: "Creating customer failed. Rollback completed"

- name: Post container setup
  hosts: localhost
  connection: local

  tasks:

    - name: Set customer variables
      ansible.builtin.set_fact:
        customer_key: "{{ hostvars[customer_name]['customer_master_key'] }}"
        customer_id: "{{ hostvars['localhost']['customer_info']['output']['id']}}"

    - name: Put customer secrets to devtank database
      import_role:
        name: db_management
        tasks_from: add_customer_secrets.yaml

- name: Add customer to prometheus
  hosts: localhost
  connection: local
  gather_facts: yes

  vars:
    prometheus_config: "/etc/prometheus/prometheus.yml"
    osm_job_name: osm-live-sensors
    new_osm_target: "{{ customer_name }}:9150"

  tasks:
    - name: Add {{ customer_name }} to Prometheus
      ansible.builtin.blockinfile:
        path: "{{ prometheus_config }}"
        # append_newline: yes <--- since ansible-core v2.16
        backup: yes
        insertafter: EOF
        marker: "# {mark} ORCHESTRATOR MANAGED {{ customer_name }}"
        block: |2
            - job_name: "{{ customer_name }}"
              proxy_url: http://{{ ansible_wg0.ipv4.address }}:8080/
              static_configs:
                - targets: ["{{ customer_name }}:9100"]

    - name: Ensure osm-live-sensors has target
      block:

        - name: Load Prometheus config
          slurp:
            src: "{{ prometheus_config }}"
          register: prom_raw

        - name: Parse Prometheus config
          set_fact:
            prom_cfg: "{{ prom_raw.content | b64decode | from_yaml }}"

        - name: Get existing osm-live-sensors job or create
          set_fact:
            osm_job: >-
              {{
                prom_cfg.scrape_configs
                | selectattr('job_name', 'equalto', osm_job_name)
                | first
                | default({
                    'job_name': osm_job_name,
                    'static_configs': [{'targets': []}]
                  })
              }}

        - name: Append target if missing
          set_fact:
            osm_job: >-
              {{
                osm_job | combine({
                  'static_configs': [{
                    'targets': (osm_job.static_configs[0].targets + [new_osm_target]) | unique
                  }]
                }, recursive=True)
              }}

        - name: Update scrape_configs
          set_fact:
            prom_cfg: >-
              {{
                prom_cfg | combine({
                  'scrape_configs': (
                    prom_cfg.scrape_configs
                    | rejectattr('job_name', 'equalto', osm_job_name)
                    | list
                    + [osm_job]
                  )
                }, recursive=True)
              }}

        - name: Write updated Prometheus config
          copy:
            dest: "{{ prometheus_config }}"
            content: "{{ prom_cfg | to_nice_yaml(indent=2) }}"
            owner: prometheus
            group: prometheus
            mode: '0644'

    - name: Restart Prometheus
      ansible.builtin.systemd_service:
        state: restarted
        name: prometheus

- name: Verifications
  hosts: localhost
  connection: local
  gather_facts: yes

  vars:
    prometheus_config: "/etc/prometheus/prometheus.yml"
    customer_services:
      - chirpstack
      - grafana-server
      - mosquitto
      - mqtt-postgres-inserter
      - postgresql@17-main
      - prometheus-node-exporter
      - pushprox-client
      - redis-server

  tasks:
    - name: Set customer domain domain
      ansible.builtin.set_fact:
        domain: "{{ hostvars['localhost'].target_domain }}"

    - name: Get current OSM host from incus
      ansible.builtin.shell:
        cmd: "incus ls {{ customer_name }} -cL -fcsv"
      register: incus_result

    - name: Set current host from incus
      ansible.builtin.set_fact:
        osm_host: "{{ incus_result.stdout }}"

    - name: Get source host info
      devtank_db:
        db_conf: "{{ db_conf.orchestrator }}"
        method: get_host
        host_name: "{{ osm_host }}"
      register: host_info

    - name: Check systemd services
      ansible.builtin.shell:
        incus exec "{{ customer_name }}" -- systemctl status "{{ item }}"
      loop: "{{ customer_services }}"

    - name: Ping transferred instance (internal)
      delegate_to: "{{ host_info.output.host_ip }}"
      connection: ssh
      retries: 3
      delay: 3
      register: result
      until: result is not failed
      ansible.builtin.shell:
        ping -c3 -W1 "{{customer_name}}.incus"

    - name: Ping customer (external)
      ansible.builtin.shell:
        ping -c3 -W1 "{{ customer_name }}.{{ domain }}"

    - name: Get orchestrator IP address
      ansible.builtin.set_fact:
        backup_host: "{{ osmbackup | default(ansible_default_ipv4.address) }}"

    - name: Extract pool name for container
      delegate_to: "{{ host_info.output.host_ip }}"
      ansible.builtin.shell: |
        incus config show {{ customer_name }} --expanded | sed -rn 's|.*pool: (.*)$|\1|p'
      register: pool_name_result
      changed_when: false

    - name: Create snapper configuration for {{ customer_name }} customer
      delegate_to: "{{ host_info.output.host_ip}}"
      connection: ssh
      ansible.builtin.shell: |
        snapper -c {{ customer_name }} create-config /var/lib/incus/storage-pools/{{ pool_name_result.stdout }}/containers/{{ customer_name }}
      args:
        executable: /bin/bash

    - name: Create snapper-backup configuration for {{ customer_name }} customer
      delegate_to: "{{ host_info.output.host_ip}}"
      connection: ssh
      ansible.builtin.copy:
        dest: /etc/snapper/backup-configs/{{ customer_name }}.json
        content: |
          {
              "config": "{{ customer_name }}",
              "target-mode": "ssh-push",
              "automatic": true,
              "source-path": "/var/lib/incus/storage-pools/{{ pool_name_result.stdout }}/containers/{{ customer_name }}",
              "target-path": "/srv/backups/incus/{{ customer_name }}",
              "ssh-host": "{{ backup_host }}",
              "ssh-user": "root",
              "ssh-identity": "/root/.ssh/id_ed25519"
          }
        mode: '0644'
        owner: root
        group: root

    - name: Create backup directory for {{ customer_name }}
      connection: local
      ansible.builtin.file:
        path: /srv/backups/incus/{{ customer_name }}
        state: directory
